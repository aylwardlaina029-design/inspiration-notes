<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#4E9A6C">
  <title>灵感记录</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1 id="app-title">灵感记录</h1>
    <p id="app-sub">记录任务 · 心情 · 灵感</p>
    <button id="settings-gear" class="header-gear" aria-label="设置" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main id="view" class="view"></main>

  <!-- 设置：右侧滑出抽屉 -->
  <div id="drawer-overlay" class="drawer-overlay" hidden></div>
  <aside id="settings-drawer" class="drawer" role="dialog" aria-modal="true" aria-label="设置" aria-hidden="true">
    <div class="drawer-head">
      <span class="drawer-title">设置</span>
      <button class="drawer-close" type="button" aria-label="关闭设置">✕</button>
    </div>
    <div id="settings-drawer-body" class="drawer-body"></div>
  </aside>

  <nav class="bottom-nav">
    <button class="nav-btn add-btn" data-action="add" aria-label="快速记录"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c-.3-4.4 1.6-8.6 5-11.2 2.8-2.2 6.2-2.8 9.8-2.2.5 3.6-.1 7-2.2 9.8C14.9 19.4 10.6 20.3 5 19Z"/><path d="M6.6 17.4 19.8 5.1"/><path d="M15.2 4.6c1.6-1.4 3.8-1.9 5.3-1.5-.4 1.6-1.1 3.7-2.7 5"/></svg></span></button>
    <button class="nav-btn" data-view="calendar"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="5.5" width="15" height="14" rx="2.5" fill="#9CC7AE" fill-opacity="0.4"/><path d="M8.5 5.5V3.5"/><path d="M15.5 5.5V3.5"/><path d="M4.5 9.2h15"/><path d="M9.3 15.2c1 1.4 4.4 1.4 5.4 0"/></svg></span><span>日历</span></button>
    <button class="nav-btn" data-view="reflections"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14c0-3-2.5-4-4.5-4C7.5 6.5 9.5 4 12 4s4.5 2.5 4.5 6c-2 0-4.5 1-4.5 4z" fill="#9CC7AE" fill-opacity="0.4"/><path d="M12 21v-7"/><path d="M9 21h6"/></svg></span><span>灵感</span></button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
