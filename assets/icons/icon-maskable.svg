<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- maskable 图标：全幅出血底 + 叶片缩至 62% 安全区 -->
  <rect width="512" height="512" fill="#F7F5EF"/>
  <g transform="translate(256 256) rotate(40) scale(0.62)">
    <clipPath id="solid">
      <rect x="-170" y="45" width="340" height="120"/>
    </clipPath>
    <path fill="#3F8759" fill-rule="evenodd" d="M 0 -150 A 162.5 162.5 0 0 1 0 150 A 162.5 162.5 0 0 1 0 -150 Z M 0 -112.3 A 128.5 128.5 0 0 1 0 112.3 A 128.5 128.5 0 0 1 0 -112.3 Z"/>
    <path fill="#3F8759" clip-path="url(#solid)" d="M 0 -150 A 162.5 162.5 0 0 1 0 150 A 162.5 162.5 0 0 1 0 -150 Z"/>
  </g>
</svg>
